<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#040711">
<title>深夜0時のベランダ園芸</title>
<style>
  :root {
    --bg-sky-top: #040711;
    --bg-sky-bottom: #162240;
    --panel-bg: rgba(15, 23, 42, 0.9);
    --panel-border: rgba(148, 163, 184, 0.25);
    --text-main: #e2e8f0;
    --text-muted: #94a3b8;
    --accent-moon: #fde047;
    --accent-water: #38bdf8;
    --accent-leaf: #4ade80;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    background: #040711;
    color: var(--text-main);
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  /* 認証ゲート画面 */
  #auth-screen {
    position: fixed;
    inset: 0;
    z-index: 200;
    background: radial-gradient(circle at 75% 20%, #1e293b 0%, #060a17 65%, #040711 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    padding-top: calc(20px + env(safe-area-inset-top));
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  #auth-screen.hidden { display: none; }

  .auth-card {
    background: rgba(15, 23, 42, 0.94);
    border: 1px solid rgba(148, 163, 184, 0.3);
    border-radius: 18px;
    width: 100%;
    max-width: 420px;
    padding: 24px 26px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65);
  }
  .auth-title { text-align: center; margin-bottom: 16px; }
  .auth-title h2 { font-size: 1.25rem; color: #fef9c3; }
  .auth-title p { font-size: 0.8rem; color: var(--text-muted); margin-top: 4px; }

  .auth-tabs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    background: #090e1a;
    padding: 4px;
    border-radius: 10px;
    margin-bottom: 16px;
  }
  .auth-tab {
    background: transparent;
    border: none;
    color: var(--text-muted);
    padding: 9px;
    border-radius: 7px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
  }
  .auth-tab.active { background: #1e293b; color: #fff; }

  .auth-field { margin-bottom: 13px; }
  .auth-field label { display: block; font-size: 0.78rem; color: #cbd5e1; margin-bottom: 5px; }
  .auth-field input {
    width: 100%;
    background: #020617;
    border: 1px solid #334155;
    color: #fff;
    border-radius: 10px;
    padding: 11px 12px;
    font-size: 16px;
    user-select: text;
    -webkit-user-select: text;
  }
  .auth-field input:focus { outline: none; border-color: #38bdf8; }

  .auth-submit-btn {
    width: 100%;
    background: linear-gradient(135deg, #0284c7, #2563eb);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 13px;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    margin-top: 4px;
  }
  .auth-submit-btn:disabled { opacity: 0.55; }
  .auth-error { color: #fca5a5; font-size: 0.8rem; margin-top: 10px; min-height: 1.2em; text-align: center; }

  /* メインゲーム画面 */
  #app {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: row;
    background: linear-gradient(180deg, var(--bg-sky-top) 0%, var(--bg-sky-bottom) 70%, #1e293b 100%);
    transition: background 1.5s ease;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    padding-left: env(safe-area-inset-left);
    padding-right: env(safe-area-inset-right);
  }

  #app.mode-midnight { --bg-sky-top: #040711; --bg-sky-bottom: #111d3a; }
  #app.mode-day { --bg-sky-top: #38bdf8; --bg-sky-bottom: #bae6fd; }
  #app.mode-evening { --bg-sky-top: #1e1b4b; --bg-sky-bottom: #9a3412; }

  .left-stage {
    flex: 1.35;
    min-width: 0;
    height: 100%;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    overflow: hidden;
  }

  #scene-svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  .plant-sway-0 { transform-origin: 145px 285px; animation: sway 5.2s ease-in-out infinite; }
  .plant-sway-1 { transform-origin: 300px 285px; animation: sway 4.7s ease-in-out infinite; }
  .plant-sway-2 { transform-origin: 455px 285px; animation: sway 5.6s ease-in-out infinite; }
  @keyframes sway {
    0%, 100% { transform: rotate(-1.4deg); }
    50% { transform: rotate(1.4deg); }
  }

  .pot-clickable { cursor: pointer; }
  .visitor-clickable { cursor: pointer; animation: visitorFloat 3s ease-in-out infinite; }
  @keyframes visitorFloat {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-3px); }
  }

  .message-overlay {
    position: relative;
    z-index: 10;
    margin: 14px 18px;
    padding: 11px 16px;
    background: rgba(10, 15, 28, 0.85);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    font-size: 0.86rem;
    line-height: 1.45;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    box-shadow: 0 4px 20px rgba(0,0,0,0.45);
  }

  .right-sidebar {
    flex: 1;
    max-width: 440px;
    min-width: 320px;
    height: 100%;
    background: var(--panel-bg);
    border-left: 1px solid var(--panel-border);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 14px 16px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    z-index: 15;
  }

  .sidebar-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 6px;
    padding-bottom: 10px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }

  .player-pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 0.74rem;
    color: #93c5fd;
    margin-bottom: 2px;
  }
  .sync-dot { width: 7px; height: 7px; border-radius: 50%; background: #4ade80; display: inline-block; }
  .sync-dot.saving { background: #facc15; }

  .clock-row { display: flex; align-items: center; gap: 8px; margin-top: 2px; flex-wrap: wrap; }
  .clock-time { font-size: 1.5rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }

  .badge-midnight {
    font-size: 0.68rem;
    padding: 2px 8px;
    border-radius: 999px;
    background: rgba(253, 224, 71, 0.18);
    color: var(--accent-moon);
    border: 1px solid rgba(253, 224, 71, 0.5);
  }
  .badge-normal {
    font-size: 0.68rem;
    padding: 2px 8px;
    border-radius: 999px;
    background: rgba(30, 41, 59, 0.8);
    color: #cbd5e1;
    border: 1px solid rgba(255,255,255,0.18);
  }

  .header-btns { display: flex; gap: 5px; flex-wrap: wrap; justify-content: flex-end; }
  .icon-btn {
    background: rgba(30, 41, 59, 0.92);
    border: 1px solid var(--panel-border);
    color: var(--text-main);
    border-radius: 8px;
    padding: 6px 8px;
    font-size: 0.75rem;
    cursor: pointer;
    white-space: nowrap;
  }

  .pot-tabs {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 7px;
    margin: 10px 0 6px;
  }
  .pot-tab {
    background: rgba(15, 23, 42, 0.75);
    border: 1px solid rgba(148, 163, 184, 0.22);
    color: var(--text-muted);
    border-radius: 9px;
    padding: 8px 4px;
    font-size: 0.78rem;
    cursor: pointer;
    text-align: center;
  }
  .pot-tab.active {
    background: rgba(56, 189, 248, 0.2);
    border-color: #38bdf8;
    color: #fff;
    font-weight: 700;
  }
  .pot-tab .tab-sub { display: block; font-size: 0.68rem; margin-top: 2px; opacity: 0.88; }

  .status-section { display: flex; flex-direction: column; gap: 10px; margin: 8px 0 10px; }
  .plant-header { display: flex; justify-content: space-between; align-items: center; }
  .plant-name { font-size: 1rem; font-weight: 700; }
  .plant-stage {
    font-size: 0.75rem;
    color: var(--accent-leaf);
    background: rgba(74, 222, 128, 0.14);
    padding: 3px 9px;
    border-radius: 999px;
  }

  .bar-row { display: flex; flex-direction: column; gap: 3px; }
  .bar-label { display: flex; justify-content: space-between; font-size: 0.78rem; color: var(--text-muted); }
  .bar-track { width: 100%; height: 8px; background: rgba(255,255,255,0.1); border-radius: 999px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 999px; transition: width 0.5s ease; }
  .fill-growth { background: linear-gradient(90deg, #22c55e, #86efac); }
  .fill-water { background: linear-gradient(90deg, #0284c7, #7dd3fc); }

  .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .action-btn {
    padding: 11px 8px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(30, 41, 59, 0.95);
    color: #fff;
    font-size: 0.86rem;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }
  .action-btn span.sub { font-size: 0.68rem; font-weight: 400; color: var(--text-muted); }

  .btn-harvest {
    grid-column: span 2;
    background: linear-gradient(135deg, #4f46e5, #7c3aed);
    border-color: #a78bfa;
    box-shadow: 0 4px 15px rgba(124, 58, 237, 0.4);
  }

  .admin-panel {
    display: none;
    background: rgba(2, 6, 23, 0.75);
    border: 1px solid rgba(251, 191, 36, 0.35);
    border-radius: 8px;
    padding: 7px 10px;
    font-size: 0.7rem;
    color: #94a3b8;
    margin-top: 10px;
    flex-shrink: 0;
  }
  .admin-panel.visible { display: block; }
  .admin-panel.open { background: rgba(2, 6, 23, 0.94); border-style: dashed; }

  .debug-toggle-header { display: flex; justify-content: space-between; align-items: center; cursor: pointer; padding: 2px 0; }
  .debug-toggle-label { color: #fde047; display: flex; align-items: center; gap: 5px; font-weight: 600; }
  .debug-status-pill { font-size: 0.65rem; padding: 1px 7px; border-radius: 999px; background: rgba(255,255,255,0.06); color: #cbd5e1; }
  .debug-status-pill.virtual { background: rgba(251, 191, 36, 0.25); color: #fde047; }

  .admin-body { display: none; flex-direction: column; gap: 7px; margin-top: 7px; padding-top: 7px; border-top: 1px solid rgba(255,255,255,0.1); }
  .admin-panel.open .admin-body { display: flex; }

  .debug-btns { display: flex; flex-wrap: wrap; gap: 5px; }
  .debug-btns button { background: #1e293b; color: #e2e8f0; border: 1px solid #475569; border-radius: 6px; padding: 4px 8px; font-size: 0.68rem; cursor: pointer; }

  .invite-box { background: rgba(30, 41, 59, 0.7); border-radius: 6px; padding: 7px; display: flex; flex-direction: column; gap: 5px; }
  .invite-row { display: flex; gap: 5px; align-items: center; }
  .invite-code-display { flex: 1; background: #020617; border: 1px solid #334155; color: #4ade80; font-family: monospace; font-size: 0.82rem; font-weight: 700; padding: 5px 8px; border-radius: 5px; user-select: all; -webkit-user-select: all; }
  .invite-btn { background: #b45309; color: #fff; border: none; border-radius: 5px; padding: 6px 9px; font-size: 0.7rem; font-weight: 600; cursor: pointer; white-space: nowrap; }

  @media (orientation: portrait) {
    #app { flex-direction: column; }
    .left-stage { flex: none; width: 100%; height: 46%; min-height: 250px; }
    .right-sidebar {
      flex: 1;
      width: 100%;
      max-width: none;
      min-width: 0;
      height: 54%;
      border-left: none;
      border-top: 1px solid var(--panel-border);
      padding: 12px 18px;
    }
  }

  @media (orientation: portrait) and (min-width: 700px) {
    .left-stage { height: 48%; }
    .right-sidebar { height: 52%; padding: 16px 28px; }
    .action-btn { padding: 14px 10px; font-size: 0.95rem; }
    .pot-tab { padding: 10px 6px; font-size: 0.86rem; }
  }

  /* モーダル */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.78);
    display: none;
    justify-content: center;
    align-items: center;
    padding: 16px;
    z-index: 100;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
  }
  .modal-overlay.open { display: flex; }

  .modal-card {
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 16px;
    width: 100%;
    max-width: 580px;
    max-height: 84%;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 18px 20px;
  }
  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid #1e293b;
  }
  .modal-close { background: none; border: none; color: #94a3b8; font-size: 1.6rem; cursor: pointer; padding: 0 6px; }

  .filter-bar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .filter-chip { background: #1e293b; color: #cbd5e1; border: 1px solid #334155; border-radius: 999px; padding: 5px 11px; font-size: 0.76rem; cursor: pointer; }
  .filter-chip.active { background: #0284c7; color: #fff; border-color: #38bdf8; }

  .seed-item, .book-item {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 10px;
    padding: 11px 13px;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }
  .seed-info h4 { font-size: 0.92rem; margin-bottom: 3px; }
  .seed-info p { font-size: 0.78rem; color: #94a3b8; line-height: 1.4; }
  .category-tag { display: inline-block; font-size: 0.68rem; padding: 1px 6px; border-radius: 4px; background: rgba(148, 163, 184, 0.18); color: #cbd5e1; margin-right: 4px; }
  .plant-select-btn { background: #0284c7; color: white; border: none; border-radius: 8px; padding: 9px 14px; font-size: 0.82rem; font-weight: 600; cursor: pointer; white-space: nowrap; }

  .garden-card {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 10px;
  }
  .garden-card.self { border-color: #38bdf8; background: rgba(30, 58, 138, 0.28); }
  .garden-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .garden-name { font-weight: 700; font-size: 0.95rem; }
  .garden-stats { font-size: 0.74rem; color: #fde047; }
  .garden-pots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .garden-pot-mini {
    background: #0f172a;
    border: 1px solid rgba(148, 163, 184, 0.2);
    border-radius: 8px;
    padding: 7px 6px;
    text-align: center;
    font-size: 0.74rem;
  }
  .garden-pot-mini span { display: block; font-size: 0.68rem; color: #4ade80; margin-top: 2px; }
</style>
</head>
<body>

<!-- 認証画面 -->
<div id="auth-screen">
  <div class="auth-card">
    <div class="auth-title">
      <h2>🌙 深夜0時のベランダ園芸</h2>
      <p>招待制スローライフ・ブラウザゲーム</p>
    </div>

    <div class="auth-tabs">
      <button class="auth-tab active" id="tab-auth-login" onclick="switchAuthMode('login')">ログイン</button>
      <button class="auth-tab" id="tab-auth-register" onclick="switchAuthMode('register')">招待コードで登録</button>
    </div>

    <div class="auth-field" id="field-invite" style="display:none;">
      <label>🎟 招待コード（管理者から受け取ったコード）</label>
      <input type="text" id="input-invite" placeholder="例：WELCOME-0000" autocomplete="off">
    </div>

    <div class="auth-field">
      <label>🌿 プレイヤー名</label>
      <input type="text" id="input-player" placeholder="2〜16文字の名前" autocomplete="username">
    </div>

    <div class="auth-field">
      <label>🔑 パスワード</label>
      <input type="password" id="input-password" placeholder="4文字以上のパスワード" autocomplete="current-password">
    </div>

    <button class="auth-submit-btn" id="btn-auth-submit" onclick="submitAuth()">ベランダに入る</button>
    <div class="auth-error" id="auth-error"></div>
  </div>
</div>

<!-- メイン画面 -->
<div id="app" class="mode-midnight">
  <div class="left-stage">
    <svg id="scene-svg" viewBox="0 0 600 360" preserveAspectRatio="xMidYMax slice">
      <defs>
        <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#fef08a" stop-opacity="0.45"/>
          <stop offset="100%" stop-color="#fef08a" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="potGrad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#7c2d12"/>
          <stop offset="50%" stop-color="#9a3412"/>
          <stop offset="100%" stop-color="#431407"/>
        </linearGradient>
      </defs>

      <g id="stars-layer">
        <circle cx="70" cy="45" r="1.5" fill="#fff" opacity="0.8"/>
        <circle cx="150" cy="80" r="1.2" fill="#fff" opacity="0.6"/>
        <circle cx="230" cy="35" r="1.8" fill="#fef08a" opacity="0.9"/>
        <circle cx="320" cy="65" r="1.2" fill="#fff" opacity="0.7"/>
        <circle cx="410" cy="40" r="1.5" fill="#fff" opacity="0.8"/>
        <circle cx="110" cy="120" r="1" fill="#fff" opacity="0.5"/>
        <circle cx="380" cy="110" r="1.3" fill="#fff" opacity="0.6"/>
        <circle cx="530" cy="125" r="1.4" fill="#fff" opacity="0.7"/>
        <circle cx="40" cy="145" r="1.2" fill="#fef08a" opacity="0.7"/>
      </g>

      <g id="celestial-body">
        <circle cx="485" cy="70" r="65" fill="url(#moonGlow)" id="moon-aura"/>
        <circle cx="485" cy="70" r="25" fill="#fef9c3" id="moon-disc"/>
      </g>

      <path d="M0,260 L0,195 L45,195 L45,170 L90,170 L90,210 L145,210 L145,160 L200,160 L200,200 L260,200 L260,175 L340,175 L340,205 L400,205 L400,165 L455,165 L455,190 L515,190 L515,155 L565,155 L565,185 L600,185 L600,260 Z" fill="#090d16" opacity="0.78"/>
      <rect x="162" y="175" width="5" height="7" fill="#fde047" opacity="0.45"/>
      <rect x="418" y="182" width="5" height="7" fill="#fde047" opacity="0.4"/>
      <rect x="532" y="170" width="5" height="7" fill="#fde047" opacity="0.5"/>

      <rect x="0" y="232" width="600" height="7" fill="#1e293b"/>
      <rect x="0" y="280" width="600" height="9" fill="#0f172a"/>
      <g fill="#1e293b">
        <rect x="40" y="238" width="7" height="42"/>
        <rect x="220" y="238" width="7" height="42"/>
        <rect x="380" y="238" width="7" height="42"/>
        <rect x="550" y="238" width="7" height="42"/>
      </g>

      <g id="visitor-layer" class="visitor-clickable" onclick="interactVisitor()"></g>

      <rect x="0" y="288" width="600" height="72" fill="#0f172a"/>
      <line x1="0" y1="288" x2="600" y2="288" stroke="#334155" stroke-width="2"/>

      <ellipse id="active-pot-ring" cx="300" cy="346" rx="54" ry="8" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.85"/>

      <g id="plant-layer-0" class="plant-sway-0"></g>
      <g id="plant-layer-1" class="plant-sway-1"></g>
      <g id="plant-layer-2" class="plant-sway-2"></g>

      <g id="pot-0" class="pot-clickable" onclick="selectPot(0)">
        <ellipse cx="145" cy="284" rx="42" ry="8" fill="#3e2723" id="soil-0"/>
        <polygon points="101,285 189,285 177,338 113,338" fill="url(#potGrad)"/>
        <rect x="96" y="279" width="98" height="10" rx="4" fill="#9a3412"/>
        <rect x="107" y="338" width="76" height="5" rx="2" fill="#431407"/>
      </g>

      <g id="pot-1" class="pot-clickable" onclick="selectPot(1)">
        <ellipse cx="300" cy="284" rx="42" ry="8" fill="#3e2723" id="soil-1"/>
        <polygon points="256,285 344,285 332,338 268,338" fill="url(#potGrad)"/>
        <rect x="251" y="279" width="98" height="10" rx="4" fill="#9a3412"/>
        <rect x="262" y="338" width="76" height="5" rx="2" fill="#431407"/>

const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbzQaaa_HAG0G1DLNRfcaXsTrf0Monz-eH9AJ7JwjGE2i9LlSn5YANAf4B-NwgvOicZK/exec';

/**
 * GASバックエンドとの共通fetch通信ヘルパー
 */
async function callGasApi(payload) {
  if (!GAS_API_URL || !GAS_API_URL.startsWith('https://')) {
    throw new Error('GAS_API_URL が設定されていません。');
  }
  const res = await fetch(GAS_API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  });
  if (!res.ok) {
    throw new Error(`HTTPエラー (${res.status})`);
  }
  return await res.json();
}

function getNow() { return Date.now() + debugTimeOffset; }
function isMidnightHour(timestamp) { return new Date(timestamp).getHours() === 0; }

function switchAuthMode(mode) {
  authMode = mode;
  document.getElementById('tab-auth-login').classList.toggle('active', mode === 'login');
  document.getElementById('tab-auth-register').classList.toggle('active', mode === 'register');
  document.getElementById('field-invite').style.display = (mode === 'register') ? 'block' : 'none';
  document.getElementById('btn-auth-submit').textContent = (mode === 'register') ? '招待コードで登録して始める' : 'ベランダに入る';
  document.getElementById('auth-error').textContent = '';
}

async function submitAuth() {
  const playerName = document.getElementById('input-player').value.trim();
  const password = document.getElementById('input-password').value.trim();
  const inviteCode = document.getElementById('input-invite').value.trim();
  const errEl = document.getElementById('auth-error');
  const btn = document.getElementById('btn-auth-submit');

  errEl.textContent = '';
  btn.disabled = true;
  btn.textContent = '通信中...';

  try {
    const payload = (authMode === 'register')
      ? { action: 'register', inviteCode, playerName, password }
      : { action: 'login', playerName, password };

    const res = await callGasApi(payload);
    if (res.ok) {
      onAuthSuccess(res);
    } else {
      errEl.textContent = res.message;
    }
  } catch (err) {
    errEl.textContent = '通信エラー: ' + err.message;
  } finally {
    btn.disabled = false;
    btn.textContent = (authMode === 'register') ? '招待コードで登録して始める' : 'ベランダに入る';
  }
}

function onAuthSuccess(res) {
  currentUser = res.user;
  if (res.state && res.state.pots) {
    state = { ...state, ...res.state };
  }

  localStorage.setItem('veranda_session_auth', JSON.stringify(currentUser));

  document.getElementById('auth-screen').classList.add('hidden');
  document.getElementById('player-name-display').textContent =
    currentUser.role === 'admin' ? `👑 ${currentUser.playerName}` : currentUser.playerName;

  const adminPanel = document.getElementById('admin-panel');
  if (currentUser.role === 'admin') {
    adminPanel.classList.add('visible');
    fetchUnusedInvites();
  } else {
    adminPanel.classList.remove('visible');
  }

  processElapsedTime();
  updateClockAndAtmosphere();
  checkMidnightVisitor();
  updateUI();
  setMessage(`おかえりなさい、${currentUser.playerName}さん。静かなベランダへようこそ。`);
}

function logoutPlayer() {
  localStorage.removeItem('veranda_session_auth');
  currentUser = null;
  activeVisitor = null;
  debugTimeOffset = 0;
  document.getElementById('auth-screen').classList.remove('hidden');
  document.getElementById('input-password').value = '';
}

function init() {
  renderSeedList('all');
  updateClockAndAtmosphere();

  const savedAuth = localStorage.getItem('veranda_session_auth');
  if (savedAuth) {
    try {
      const auth = JSON.parse(savedAuth);
      document.getElementById('input-player').value = auth.playerName || '';
    } catch (e) {}
  }

  setInterval(() => {
    if (!currentUser) return;
    processElapsedTime();
    updateClockAndAtmosphere();
    updateUI();
  }, 1000);
}

function saveGame() {
  if (!currentUser) return;

  const dot = document.getElementById('sync-dot');
  dot.classList.add('saving');

  if (syncTimer) clearTimeout(syncTimer);
  syncTimer = setTimeout(async () => {
    try {
      await callGasApi({
        action: 'sync',
        auth: currentUser,
        stateJson: JSON.stringify(state)
      });
    } catch (e) {
      console.error(e);
    } finally {
      dot.classList.remove('saving');
    }
  }, 1200);
}

    if (!res || !res.ok) {

    });
  }

/* ゲーム進行ロジック */
function processElapsedTime() {
  const now = getNow();
  const elapsedMs = now - state.lastUpdate;
  if (elapsedMs <= 0) { state.lastUpdate = now; return; }

  const elapsedHours = elapsedMs / (1000 * 60 * 60);
  const speedMultiplier = isMidnightHour(now) ? 2.0 : 1.0;

  state.pots.forEach(pot => {
    if (pot.plantId && pot.growth < 100) {
      const plant = PLANTS_DB[pot.plantId];
      const dryHours = plant.dryHours || 36;
      const waterLoss = elapsedHours * (100 / dryHours);
      const avgWater = Math.max(0, pot.water - waterLoss / 2);
      pot.water = Math.max(0, pot.water - waterLoss);

      if (avgWater > 0) {
        const waterEfficiency = avgWater > 20 ? 1.0 : 0.5;
        const growthGain = (elapsedHours / plant.growHours) * 100 * speedMultiplier * waterEfficiency;
        pot.growth = Math.min(100, pot.growth + growthGain);
      }
    } else if (pot.plantId && pot.growth >= 100) {
      const waterLoss = elapsedHours * (100 / 48);
      pot.water = Math.max(0, pot.water - waterLoss);
    }
  });

  state.lastUpdate = now;
}

function checkMidnightVisitor() {
  const now = getNow();
  if (!isMidnightHour(now)) {
    activeVisitor = null;
    renderVisitorSVG();
    return;
  }

  if (!activeVisitor && Math.random() < 0.70) {
    const list = Object.values(VISITORS_DB);
    const totalWeight = list.reduce((sum, v) => sum + v.weight, 0);
    let rand = Math.random() * totalWeight;
    for (const v of list) {
      if (rand < v.weight) { activeVisitor = v; break; }
      rand -= v.weight;
    }
    visitorInteracted = false;
    renderVisitorSVG();
    setMessage(`✦ ${activeVisitor.greetMsg}`);
  }
}

function interactVisitor() {
  if (!activeVisitor) return;
  playMagicSound();

  if (visitorInteracted) {
    setMessage(`${activeVisitor.name}は静かに深夜の空気を楽しんでいる。`);
    return;
  }

  visitorInteracted = true;
  state.visitorLog[activeVisitor.id] = (state.visitorLog[activeVisitor.id] || 0) + 1;

  if (activeVisitor.rewardType === 'growth') {
    let applied = false;
    state.pots.forEach(pot => {
      if (pot.plantId && pot.growth < 100) {
        pot.growth = Math.min(100, pot.growth + activeVisitor.rewardValue);
        applied = true;
      }
    });
    setMessage(applied ? `✨ ${activeVisitor.rewardMsg}` : `${activeVisitor.name}は空の鉢を覗き込んでいる。種をまいておけば成長を助けてくれそうだ。`);
  } else if (activeVisitor.rewardType === 'water') {
    state.pots.forEach(pot => { pot.water = 100; });
    setMessage(`✨ ${activeVisitor.rewardMsg}`);
  } else if (activeVisitor.rewardType === 'water_add') {
    state.pots.forEach(pot => { pot.water = Math.min(100, pot.water + activeVisitor.rewardValue); });
    setMessage(`✨ ${activeVisitor.rewardMsg}`);
  } else if (activeVisitor.rewardType === 'both') {
    state.pots.forEach(pot => {
      pot.water = 100;
      if (pot.plantId && pot.growth < 100) {
        pot.growth = Math.min(100, pot.growth + activeVisitor.rewardValue);
      }
    });
    setMessage(`✨ ${activeVisitor.rewardMsg}`);
  }

  saveGame();
  updateUI();
}

function updateClockAndAtmosphere() {
  const now = getNow();
  const d = new Date(now);
  const h = d.getHours();
  const m = String(d.getMinutes()).padStart(2, '0');

  const displayHour = (h === 0) ? '24' : String(h).padStart(2, '0');
  document.getElementById('clock-display').textContent = `${displayHour}:${m}`;

  const appEl = document.getElementById('app');
  const badgeEl = document.getElementById('time-badge');
  const starsEl = document.getElementById('stars-layer');
  const particlesEl = document.getElementById('moon-particles');
  const moonDisc = document.getElementById('moon-disc');
  const moonAura = document.getElementById('moon-aura');

  appEl.classList.remove('mode-midnight', 'mode-day', 'mode-evening');

  if (h === 0) {
    appEl.classList.add('mode-midnight');
    badgeEl.className = 'badge-midnight';
    badgeEl.textContent = '✦ 24時限定：月光ボーナス中 (2倍)';
    starsEl.style.opacity = '1';
    particlesEl.style.display = 'block';
    moonDisc.setAttribute('fill', '#fef9c3');
    moonAura.setAttribute('opacity', '1');
  } else if (h >= 6 && h < 17) {
    appEl.classList.add('mode-day');
    badgeEl.className = 'badge-normal';
    badgeEl.textContent = '☀️ 昼のベランダ（通常速度）';
    starsEl.style.opacity = '0';
    particlesEl.style.display = 'none';
    moonDisc.setAttribute('fill', '#ffffff');
    moonAura.setAttribute('opacity', '0.3');
  } else if (h >= 17 && h < 19) {
    appEl.classList.add('mode-evening');
    badgeEl.className = 'badge-normal';
    badgeEl.textContent = '🌆 夕暮れ（24時からボーナス）';
    starsEl.style.opacity = '0.3';
    particlesEl.style.display = 'none';
  } else {
    appEl.classList.add('mode-midnight');
    badgeEl.className = 'badge-normal';
    badgeEl.textContent = '🌙 静かな夜（24時からボーナス）';
    starsEl.style.opacity = '0.8';
    particlesEl.style.display = 'none';
    moonDisc.setAttribute('fill', '#e2e8f0');
    moonAura.setAttribute('opacity', '0.4');
  }
}

      } else if (g < 100) {
        svgContent = `<path d="M${cx},285 Q${cx-5},222 ${cx},168" stroke="#16a34a" stroke-width="6" stroke-linecap="round" fill="none"/><ellipse cx="${cx-22}" cy="250" rx="19" ry="9" transform="rotate(-25 ${cx-22} 250)" fill="#15803d"/><ellipse cx="${cx+22}" cy="245" rx="19" ry="9" transform="rotate(25 ${cx+22} 245)" fill="#16a34a"/><ellipse cx="${cx-24}" cy="208" rx="17" ry="8" transform="rotate(-30 ${cx-24} 208)" fill="#22c55e"/><ellipse cx="${cx+24}" cy="204" rx="17" ry="8" transform="rotate(30 ${cx+24} 204)" fill="#4ade80"/><circle cx="${cx}" cy="160" r="13" fill="${plant.colorPetal}" opacity="0.9"/>`;

lant.colorPetal}"/><circle cx="10" cy="0" r="8" fill="${plant.colorPetal}"/><circle cx="0" cy="10" r="8" fill="${plant.colorPetal}"/><circle cx="-10" cy="0" r="8" fill="${plant.colorPetal}"/><circle cx="0" cy="0" r="5" fill="${plant.colorCenter}"/></g>`;

}

function updateUI() {
  const idx = state.selectedPot;
  const pot = state.pots[idx];

  document.getElementById('active-pot-ring').setAttribute('cx', POT_X_POSITIONS[idx]);

  state.pots.forEach((p, i) => {
    const tabEl = document.getElementById(`tab-pot-${i}`);
    const subEl = document.getElementById(`tab-sub-${i}`);
    tabEl.classList.toggle('active', i === idx);
    if (p.plantId) {
      const info = PLANTS_DB[p.plantId];
      subEl.textContent = p.growth >= 100 ? `✨${info.shortName}` : `${info.shortName} ${Math.floor(p.growth)}%`;
    } else {
      subEl.textContent = '空き';
    }
  });

  const nameEl = document.getElementById('plant-name');
  const stageEl = document.getElementById('plant-stage');
  const growthText = document.getElementById('growth-text');
  const growthBar = document.getElementById('growth-bar');
  const waterText = document.getElementById('water-text');
  const waterBar = document.getElementById('water-bar');
  const btnHarvest = document.getElementById('btn-harvest');

  if (!pot.plantId) {
    nameEl.textContent = `${POT_NAMES[idx]}：空の植木鉢`;
    stageEl.textContent = '種をまこう';
    growthText.textContent = '0.0%';
    growthBar.style.width = '0%';
    waterText.textContent = `${Math.round(pot.water)}%`;
    waterBar.style.width = `${pot.water}%`;
    btnHarvest.style.display = 'none';
  } else {
    const plant = PLANTS_DB[pot.plantId];
    nameEl.textContent = `${POT_NAMES[idx]}：${plant.name}`;

    if (pot.growth >= 100) { stageEl.textContent = '✨ 収穫可能！'; btnHarvest.style.display = 'flex'; }
    else if (pot.growth >= 80) { stageEl.textContent = 'あと少し'; btnHarvest.style.display = 'none'; }
    else if (pot.growth >= 45) { stageEl.textContent = '成長期'; btnHarvest.style.display = 'none'; }
    else if (pot.growth >= 15) { stageEl.textContent = '若葉'; btnHarvest.style.display = 'none'; }
    else { stageEl.textContent = '芽生え'; btnHarvest.style.display = 'none'; }

    growthText.textContent = `${pot.growth.toFixed(1)}%`;
    growthBar.style.width = `${pot.growth}%`;
    waterText.textContent = `${Math.round(pot.water)}%`;
    waterBar.style.width = `${pot.water}%`;
  }

  renderAllPlantsSVG();
}

function setMessage(text) {
  document.getElementById('message-text').textContent = text;
}

document.getElementById('btn-water').addEventListener('click', () => {
  const idx = state.selectedPot;
  const pot = state.pots[idx];
  pot.water = 100;
  playWaterSound();

  if (pot.plantId) {
    const p = PLANTS_DB[pot.plantId];
    setMessage(isMidnightHour(getNow())
      ? `月明かりの下、${POT_NAMES[idx]}の「${p.name}」に水をあげた。葉が露を弾いている。`
      : `${POT_NAMES[idx]}の「${p.name}」の土がしっとりとうるおった。`);
  } else {
    setMessage(`${POT_NAMES[idx]}の土を湿らせた。いつでも種をまける状態だ。`);
  }
  saveGame();
  updateUI();
});

document.getElementById('btn-harvest').addEventListener('click', () => {
  const idx = state.selectedPot;
  const pot = state.pots[idx];
  if (!pot.plantId || pot.growth < 100) return;

  const p = PLANTS_DB[pot.plantId];
  state.harvested[p.id] = (state.harvested[p.id] || 0) + 1;

  setMessage(`✨ ${POT_NAMES[idx]}の「${p.name}」を収穫し、図鑑に記録した！`);
  pot.plantId = null;
  pot.growth = 0;
  saveGame();
  updateUI();
});

document.getElementById('btn-seed').addEventListener('click', () => {
  document.getElementById('seed-modal-title').textContent = `🌱 ${POT_NAMES[state.selectedPot]}に植える種をえらぶ（全20種）`;
  document.getElementById('modal-seed').classList.add('open');
});

document.getElementById('btn-book').addEventListener('click', () => {
  renderBookList();
  document.getElementById('modal-book').classList.add('open');
});

function closeModals() {
  document.querySelectorAll('.modal-overlay').forEach(el => el.classList.remove('open'));
}

function filterSeeds(category, btnEl) {
  document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
  if (btnEl) btnEl.classList.add('active');
  renderSeedList(category);
}

function renderSeedList(filterCategory) {
  const container = document.getElementById('seed-list');
  container.innerHTML = '';
  Object.values(PLANTS_DB)
    .filter(p => filterCategory === 'all' || p.category === filterCategory)
    .forEach(plant => {
      const div = document.createElement('div');
      div.className = 'seed-item';
      div.innerHTML = `
        <div class="seed-info">
          <h4><span class="category-tag">${plant.category}</span>${plant.name} <span style="font-size:0.74rem; color:#4ade80;">(${plant.daysLabel})</span></h4>
          <p>${plant.desc}</p>
        </div>
        <button class="plant-select-btn" onclick="plantSeed('${plant.id}')">植える</button>
      `;
      container.appendChild(div);
    });
}

function plantSeed(id) {
  const idx = state.selectedPot;
  state.pots[idx] = { plantId: id, growth: 2, water: 100 };
  state.lastUpdate = getNow();
  const p = PLANTS_DB[id];
  setMessage(`${POT_NAMES[idx]}に「${p.name}」の種をまいた。${p.daysLabel}の予定だ。`);
  saveGame();
  updateUI();
  closeModals();
}

function renderBookList() {
  const container = document.getElementById('book-list');
  container.innerHTML = '';

  const plantList = Object.values(PLANTS_DB);
  const unlockedPlants = plantList.filter(p => (state.harvested[p.id] || 0) > 0).length;

  const plantHeader = document.createElement('h4');
  plantHeader.style.cssText = 'margin: 0 0 8px; font-size:0.85rem; color:#4ade80;';
  plantHeader.textContent = `🌿 育てた植物図鑑（${unlockedPlants} / ${plantList.length}種）`;
  container.appendChild(plantHeader);

  plantList.forEach(plant => {
    const count = state.harvested[plant.id] || 0;
    const unlocked = count > 0;
    const div = document.createElement('div');
    div.className = 'book-item';
    div.innerHTML = `
      <div class="seed-info">
        <h4><span class="category-tag">${plant.category}</span>${unlocked ? plant.name : '？？？（未収穫の植物）'} <span style="font-size:0.74rem; color:#fbbf24;">${unlocked ? `収穫数: ${count}` : plant.daysLabel}</span></h4>
        <p>${unlocked ? plant.teaNote : 'この植物を100%まで育てて収穫すると記録が解放されます。'}</p>
      </div>
    `;
    container.appendChild(div);
  });

  const visitorList = Object.values(VISITORS_DB);
  const unlockedVisitors = visitorList.filter(v => (state.visitorLog[v.id] || 0) > 0).length;
  const visitorHeader = document.createElement('h4');
  visitorHeader.style.cssText = 'margin: 14px 0 8px; font-size:0.85rem; color:#fde047;';
  visitorHeader.textContent = `🌙 深夜24〜25時の来訪者メモ（${unlockedVisitors} / ${visitorList.length}種）`;
  container.appendChild(visitorHeader);

  visitorList.forEach(v => {
    const count = state.visitorLog[v.id] || 0;
    const unlocked = count > 0;
    const div = document.createElement('div');
    div.className = 'book-item';
    div.innerHTML = `
      <div class="seed-info">
        <h4>${unlocked ? v.name : '？？？（深夜の来訪者）'} <span style="font-size:0.74rem; color:#38bdf8;">${unlocked ? `出会った回数: ${count}` : '24〜25時限定'}</span></h4>
        <p>${unlocked ? v.rewardMsg : '深夜0時台にベランダを開くと、気まぐれに遊びに来ることがあります。'}</p>
      </div>
    `;
    container.appendChild(div);
  });
}

/* 環境音 */
let audioCtx = null;
let isSoundOn = false;
let cricketTimer = null;

document.getElementById('btn-sound').addEventListener('click', () => {
  isSoundOn = !isSoundOn;
  const btn = document.getElementById('btn-sound');
  if (isSoundOn) { btn.textContent = '🔊'; startAmbientSound(); }
  else { btn.textContent = '🔇'; stopAmbientSound(); }
});

function startAmbientSound() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  cricketTimer = setInterval(() => { if (isSoundOn) playCricketChirp(); }, 4200);
  playCricketChirp();
}

function stopAmbientSound() { if (cricketTimer) clearInterval(cricketTimer); }

function playCricketChirp() {
  if (!audioCtx || !isSoundOn) return;
  const now = audioCtx.currentTime;
  for (let i = 0; i < 3; i++) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(4200, now + i * 0.18);
    gain.gain.setValueAtTime(0.001, now + i * 0.18);
    gain.gain.exponentialRampToValueAtTime(0.018, now + i * 0.18 + 0.04);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.18 + 0.14);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now + i * 0.18);
    osc.stop(now + i * 0.18 + 0.15);
  }
}

function playWaterSound() {
  if (!audioCtx || !isSoundOn) return;
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(320, now);
  osc.frequency.exponentialRampToValueAtTime(680, now + 0.15);
  gain.gain.setValueAtTime(0.05, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(now);
  osc.stop(now + 0.2);
}

function playMagicSound() {
  if (!audioCtx || !isSoundOn) return;
  const now = audioCtx.currentTime;
  [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, now + i * 0.08);
    gain.gain.setValueAtTime(0.04, now + i * 0.08);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.08 + 0.35);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now + i * 0.08);
    osc.stop(now + i * 0.08 + 0.36);
  });
}

/* 管理者専用 */
function toggleAdminPanel() {
  if (!currentUser || currentUser.role !== 'admin') return;
  const panel = document.getElementById('admin-panel');
  const arrow = document.getElementById('debug-arrow');
  const isOpen = panel.classList.toggle('open');
  arrow.textContent = isOpen ? '▾' : '▸';
}

function updateDebugPill(text, isVirtual) {
  const pill = document.getElementById('debug-offset-label');
  pill.textContent = text;
  pill.classList.toggle('virtual', isVirtual);
}

function debugSetMidnight() {
  const realNow = new Date();
  const target = new Date(realNow);
  target.setHours(0, 15, 0, 0);
  if (target.getTime() < realNow.getTime()) target.setDate(target.getDate() + 1);
  debugTimeOffset = target.getTime() - Date.now();
  state.lastUpdate = getNow();
  updateDebugPill('仮想: 24:15', true);
  updateClockAndAtmosphere();
  setMessage('【テスト】時計を深夜24:15に合わせました。');
}

function debugSetDay() {
  const realNow = new Date();
  const target = new Date(realNow);
  target.setHours(14, 0, 0, 0);
  if (target.getTime() < realNow.getTime()) target.setDate(target.getDate() + 1);
  debugTimeOffset = target.getTime() - Date.now();
  state.lastUpdate = getNow();
  updateDebugPill('仮想: 14:00', true);
  updateClockAndAtmosphere();
  activeVisitor = null;
  renderVisitorSVG();
  setMessage('【テスト】時計を昼の14:00に合わせました。');
}

function debugSpawnVisitor() {
  const keys = Object.keys(VISITORS_DB);
  const currentIdx = activeVisitor ? keys.indexOf(activeVisitor.id) : -1;
  const nextKey = keys[(currentIdx + 1) % keys.length];
  activeVisitor = VISITORS_DB[nextKey];
  visitorInteracted = false;
  renderVisitorSVG();
  setMessage(`【テスト】${activeVisitor.greetMsg}`);
}

function debugAddHours(hours) {
  debugTimeOffset += hours * 60 * 60 * 1000;
  processElapsedTime();
  updateClockAndAtmosphere();
  updateUI();
  saveGame();
  setMessage(`【テスト】時間を ${hours}時間 進めました。`);
}

function debugResetTime() {
  debugTimeOffset = 0;
  state.lastUpdate = getNow();
  updateDebugPill('実時間', false);
  updateClockAndAtmosphere();
  setMessage('時計を現実の時刻に戻しました。');
}

init();
